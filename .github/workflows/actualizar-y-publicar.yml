# Actualiza los datos una vez por día y publica el sitio estático en GitHub Pages (gratis).
# - 06:00 hora argentina: corre el pipeline, valida y commitea public/data/ si hubo cambios.
# - Luego compila Next.js (export estático) y lo publica.
# Requisitos: en Settings → Pages elegir "Source: GitHub Actions".
name: Actualizar datos y publicar

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  datos:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bajar catálogos y regenerar JSON
        run: npm run data:update
      - name: Validar datos
        run: npm run data:validate
      - name: Commitear cambios
        run: |
          git config user.name "elegi-eficiente-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data pipeline/history
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualización $(date -u +%Y-%m-%d)"
            git push
          fi

  compilar:
    needs: datos
    if: always() && (needs.datos.result == 'success' || needs.datos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Compilar sitio estático
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    needs: compilar
    if: always() && needs.compilar.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
